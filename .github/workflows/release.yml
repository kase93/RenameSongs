name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Tests
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o rename_songs.exe .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: rename_songs.exe
          generate_release_notes: true
